[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quant"
version = "1.0.1"
description = "A-share quant research framework: no-lookahead backtest engine, factor IC/IR validation, walk-forward out-of-sample verification"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "pyarrow>=14.0",
    "numpy>=1.24",
    "pydantic>=2.5",
    "python-dotenv>=1.0",
    "matplotlib>=3.7",
    "scipy>=1.10",
    "tushare>=1.2.89",
    "akshare>=1.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
